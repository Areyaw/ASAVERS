</style></head><body>
<div class="app"><div class="top"><div class="shade" id="shade"><section id="hub" class="hub" aria-label="Asa Hub" aria-hidden="true" inert><div class="asa"><div id="hav"></div><div class="bub" id="hmsg"></div></div><div class="stats" id="hs"></div><div id="hp"></div><form class="f" id="qf"><b>Tambah tugas cepat</b><input name="n" placeholder="Nama tugas" required aria-label="Nama tugas"><input name="d" type="datetime-local" required aria-label="Batas waktu"><button class="btn">Tambah</button></form><button class="btn alt" id="hc" type="button">Tutup</button></section>

function afterDone(t){if(t.r&&!t.sp&&allDone(t))spawn(t);saveH();save();render()}
function leftN(){return S.tasks.reduce(function(a,t){return a+t.s.filter(function(x){return!x[3]}).length},0)}
function sumH(){var tk=dkey(Date.now()),dl=0,sb=0,dn=0;S.tasks.forEach(function(t){if(!allDone(t)&&dkey(t.dl)==tk)dl++;t.s.forEach(function(x){if(!x[3]&&dkey(x[1])==tk)sb++})});S.hist.forEach(function(h){if(dkey(h)==tk)dn++});
return '<div><b>'+dl+'</b><small>tenggat hari ini</small></div><div><b>'+sb+'</b><small>sub-tugas hari ini</small></div><div><b>'+dn+'</b><small>selesai hari ini</small></div>'}
